<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container { display: flex; justify-content: center; align-items: center; height: 100vh; width: 100%; background: var(--bg-color); }
        .login-card { background: var(--card-bg); padding: 40px; border-radius: 16px; box-shadow: 0 8px 30px var(--shadow); width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--border); }
        .login-card h2 { color: var(--primary); margin-bottom: 30px; font-size: 28px; }
        .login-card input { margin-bottom: 20px; }
        .login-card button { width: 100%; }
        .error-msg { color: var(--danger); margin-top: 15px; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>🔒 Admin Login</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn" onclick="login()">Login to Dashboard</button>
            <div id="errorMsg" class="error-msg">❌ Invalid Username or Password!</div>
        </div>
    </div>

    <script>
        // Agar pehle se login hai toh direct dashboard bhej do
        if(localStorage.getItem('adminLoggedIn') === 'true') {
            window.location.href = 'admin.html';
        }

        async function login() {
            const btn = document.getElementById('loginBtn');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            if(!username || !password) return;

            btn.innerText = 'Checking...';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('adminLoggedIn', 'true');
                    window.location.href = 'admin.html';
                } else {
                    errorMsg.style.display = 'block';
                    btn.innerText = 'Login to Dashboard';
                }
            } catch (err) {
                alert('Server error!');
                btn.innerText = 'Login to Dashboard';
            }
        }
    </script>
</body>
</html>
